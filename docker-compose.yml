version: '3.8'

services:
  # Redis para caché de historial
  redis:
    image: redis:7-alpine
    container_name: edu-nexus-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - edu-nexus-network

  # PostgreSQL para logs y usuarios
  postgres:
    image: postgres:14-alpine
    container_name: edu-nexus-postgres
    environment:
      POSTGRES_DB: edu_nexus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - edu-nexus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación FastAPI
  # NOTA: Este docker-compose es SOLO para desarrollo local
  # Para producción (Railway/AWS), solo se usa el Dockerfile
  app:
    build: .
    container_name: edu-nexus-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobrescribir con servicios locales si usas Redis/Postgres local
      - REDIS_URL=${REDIS_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./presentations:/app/presentations
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - edu-nexus-network

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  model_cache:
    driver: local

networks:
  edu-nexus-network:
    driver: bridge
